  <script>
// ============================================================
//  PAGE D'ESSAI — sujet #8 · la carte qui suit la lecture
//  Le VRAI code de la page du proche (share.js, map.js, style.css), sur un faux
//  voyage : trois journées en Andalousie, avec des photos situées.
//  Rien n'est demandé à internet : les images sont dessinées ici même.
//  Ce fichier n'existe que pour l'essai — il part à la poubelle après le choix.
// ============================================================
(function () {
  // --- Le lien d'essai est toujours complet : on ajoute ?t=essai si besoin
  const p = new URLSearchParams(location.search);
  if (!p.get("t")) { p.set("t", "essai"); location.replace(location.pathname + "?" + p.toString()); return; }

  // --- La barre de choix du suivi, en bas de l'écran
  const mode = (p.get("suivi") || "photo").toLowerCase();
  if (!p.get("suivi")) { p.set("suivi", "photo"); history.replaceState(null, "", location.pathname + "?" + p.toString()); }
  const link = (v, txt) => {
    const q = new URLSearchParams(location.search); q.set("suivi", v);
    return `<a href="${location.pathname}?${q}" class="${mode === v ? "on" : ""}">${txt}</a>`;
  };
  addEventListener("DOMContentLoaded", () => {
    const bar = document.getElementById("essai-bar");
    if (bar) bar.innerHTML = `<b>Essai · la carte suit</b><span class="sp"></span>${link("photo", "la photo")}${link("jour", "la journée")}${link("off", "rien")}`;
  });

  // --- Les photos : dessinées sur place, aucune image à télécharger
  const COL = [["#F97316", "#FFD9A8"], ["#0D8FE0", "#BEE3FA"], ["#7CB518", "#DDF1B8"], ["#8B5CF6", "#DED4FD"], ["#E05A8A", "#FBD3E1"]];
  let shotN = 0;
  function shot(label) {
    const [a, b] = COL[shotN++ % COL.length];
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${b}"/><stop offset="1" stop-color="${a}"/></linearGradient></defs>
      <rect width="800" height="600" fill="url(#g)"/>
      <circle cx="640" cy="130" r="62" fill="#fff" opacity=".55"/>
      <path d="M0 470 L200 320 L330 430 L500 250 L800 470 L800 600 L0 600 Z" fill="#fff" opacity=".28"/>
      <text x="400" y="330" text-anchor="middle" font-family="Nunito, system-ui, sans-serif" font-size="46" font-weight="800" fill="#123F66">${label}</text>
      <text x="400" y="382" text-anchor="middle" font-family="Nunito, system-ui, sans-serif" font-size="24" font-weight="700" fill="#123F66" opacity=".65">photo d'essai</text>
    </svg>`;
    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
  }

  // --- Trois journées, des lieux réels : le satellite a de quoi montrer
  const J = ["2026-05-04", "2026-05-05", "2026-05-06"];
  const at = (iso, h, m) => `${iso}T${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:00Z`;
  let n = 0;
  const photo = (iso, h, mn, lat, lng, caption) => ({
    id: "m" + (++n), day_date: iso, kind: "photo", path: shot(caption), thumb_path: null,
    lat, lng, taken_at: at(iso, h, mn), caption, audio_path: null, transport: null,
    author_id: null, sort_order: n, created_at: at(iso, h, mn),
  });

  const media = [
    photo(J[0],  9, 40, 37.38614, -5.99255, "la Giralda"),
    photo(J[0], 11, 10, 37.38300, -5.99085, "l'Alcázar"),
    photo(J[0], 15, 20, 37.37750, -5.98690, "la plaza de España"),
    photo(J[0], 19, 30, 37.38620, -6.00210, "Triana, au coucher du soleil"),
    photo(J[1], 10, 15, 36.74190, -5.16650, "le Puente Nuevo"),
    photo(J[1], 11, 30, 36.74400, -5.16820, "les arènes"),
    photo(J[1], 14, 10, 36.74090, -5.16620, "le mirador"),
    photo(J[1], 17, 45, 36.73950, -5.16200, "les bains arabes"),
    photo(J[2],  9, 30, 37.17600, -3.58890, "les palais nasrides"),
    photo(J[2], 12, 15, 37.17800, -3.58430, "le Generalife"),
    photo(J[2], 18, 50, 37.18080, -3.59260, "San Nicolás, face à l'Alhambra"),
    photo(J[2], 20, 30, 37.17650, -3.59930, "la cathédrale, le soir"),
  ];

  // Une trace pour les jours 1 et 3 ; le jour 2 n'en a pas, exprès (l'app relie
  // alors les photos entre elles, en pointillés — c'est un cas à voir aussi).
  const seg = (pts, iso, t0) => pts.map(([lat, lng, alt], i) => ({ lat, lng, alt, t: Date.parse(at(iso, t0 + i, 0)) }));
  const tracks = [
    { id: "t1", day_date: J[0], source: "gps", distance_m: 7400,
      points: seg([[37.38614, -5.99255, 12], [37.38470, -5.99180, 11], [37.38300, -5.99085, 10], [37.38050, -5.98890, 14], [37.37750, -5.98690, 9], [37.38100, -5.99500, 8], [37.38620, -6.00210, 7]], J[0], 9) },
    { id: "t3", day_date: J[2], source: "gps", distance_m: 9100,
      points: seg([[37.17600, -3.58890, 790], [37.17690, -3.58650, 812], [37.17800, -3.58430, 835], [37.17950, -3.58900, 760], [37.18080, -3.59260, 745], [37.17820, -3.59700, 700], [37.17650, -3.59930, 685]], J[2], 9) },
  ];

  const days = [
    { id: "d1", day_date: J[0], title: "Séville, à pied", place: "Séville", published_at: at(J[0], 21, 0), author_id: null, audio_path: null, transport: "walk",
      story: "On est arrivés par le train de midi. La chaleur tombe d'un coup dans les ruelles de Santa Cruz, et puis on débouche sur la Giralda et on ne dit plus rien.\nL'après-midi, la plaza de España : des azulejos partout, une province par arche. Le soir, on a traversé le pont pour dîner à Triana, les pieds dans la poussière et le fleuve tout orange." },
    { id: "d2", day_date: J[1], title: "Ronda, au bord du vide", place: "Ronda", published_at: at(J[1], 21, 0), author_id: null, audio_path: null, transport: "car",
      story: "Deux heures de route et la montagne se fend en deux. Le Puente Nuevo enjambe cent mètres de rien du tout ; on se penche, on recule, on se repenche.\nLes arènes sont vides et silencieuses. En bas, les bains arabes ont gardé leur fraîcheur — c'est le seul endroit frais de la journée." },
    { id: "d3", day_date: J[2], title: "Grenade et l'Alhambra", place: "Grenade", published_at: at(J[2], 22, 0), author_id: null, audio_path: null, transport: "car",
      story: "Billets à neuf heures et demie. Les palais nasrides, ça ne se raconte pas : la lumière passe par mille petits trous et se pose sur l'eau.\nLe Generalife, ses jardins, ses cyprès taillés. Et pour finir, San Nicolás au coucher du soleil, avec toute l'Alhambra en face et la Sierra Nevada encore blanche derrière." },
  ];

  const D = {
    trip: { id: "essai", title: "Andalousie", subtitle: "trois jours de mai", replay_speed: 1,
      description: "Séville, Ronda, Grenade. Un carnet d'essai pour regarder la carte suivre la lecture.",
      start_date: J[0], end_date: J[2], cover_path: shot("Andalousie"), allow_comments: false, publish_mode: "live" },
    authors: [], days, stories: [], tracks, media, voices: [], comments: [],
    stops: [
      { id: "s1", day_date: J[0], lat: 37.38300, lng: -5.99085, at_time: "11:10", name: "Real Alcázar", category: "monument", note: "réserver la veille", media_ids: [], author_id: null, sort_order: 1, created_at: at(J[0], 11, 10) },
      { id: "s2", day_date: J[1], lat: 36.74400, lng: -5.16820, at_time: "11:30", name: "Plaza de toros", category: "monument", note: "", media_ids: [], author_id: null, sort_order: 1, created_at: at(J[1], 11, 30) },
      { id: "s3", day_date: J[2], lat: 37.17800, lng: -3.58430, at_time: "12:15", name: "Generalife", category: "parc", note: "l'ombre des cyprès", media_ids: [], author_id: null, sort_order: 1, created_at: at(J[2], 12, 15) },
    ],
  };

  // --- ?sansposition=1 : le même carnet, mais dont AUCUNE photo n'a de position et
  //     sans aucune trace. La carte ne doit alors rien gagner : pas de pastille, pas
  //     de recadrage — elle se comporte comme avant le sujet #8.
  if (p.get("sansposition") === "1") {
    D.tracks = []; D.stops = [];
    D.media = D.media.map((m) => ({ ...m, lat: null, lng: null }));
  }

  // --- On remplace la couche qui parle à la base : rien ne sort d'ici.
  window.API_OVERRIDE = {
    isConfigured: () => true,
    useAnonymousSession() { },
    publicUrl: (path) => path || "",
    getSharedTrip: () => Promise.resolve(D),
    addSharedComment: () => Promise.reject(new Error("Page d'essai : rien n'est envoyé.")),
    uploadAnonAudio: () => Promise.reject(new Error("Page d'essai : rien n'est envoyé.")),
    subscribePush: () => Promise.resolve(),
    unsubscribePush: () => Promise.resolve(),
  };
})();
  </script>
