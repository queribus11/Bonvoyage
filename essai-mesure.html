<!doctype html>
<html lang="fr" class="is-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Bonvoyage — essai : trois façons de survoler une journée</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Caveat:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
    .essai { padding: 14px 16px calc(24px + var(--safe-b)); max-width: 560px; margin: 0 auto; }
    /* Collée en haut, comme sur la vraie page : sans cela, appuyer sur A ou B fait
       descendre la page et le survol se jouerait hors de l'écran. */
    #essai-map { position: sticky; top: 0; z-index: 20; height: 48vh; min-height: 360px;
      background: #0E1620; border-radius: 0 0 20px 20px; overflow: hidden; }
    /* Règle 13 : la sortie est VISIBLE EN PERMANENCE, en haut à gauche, libellée en clair,
       et une seule pression suffit. Dans l'app posée sur l'écran d'accueil il n'y a aucun
       bouton « retour » de navigateur : sans celui-ci, Sophie serait enfermée ici. */
    #sortie { position: fixed; top: calc(10px + var(--safe-t)); left: 12px; z-index: 40;
      display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px 9px 11px;
      border-radius: 999px; border: 1px solid rgba(255,255,255,.14);
      background: rgba(16,22,30,.72); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      color: #fff; font: inherit; font-size: 14.5px; font-weight: 700; text-decoration: none;
      box-shadow: 0 6px 20px rgba(0,0,0,.35); }
    #sortie .i { width: 17px; height: 17px; }
    .choix { display: grid; gap: 12px; margin: 16px 0 10px; }
    .choix button { text-align: left; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line);
      background: var(--card); color: var(--ink); font: inherit; cursor: pointer; }
    .choix button b { display: block; font-size: 16px; font-weight: 800; margin-bottom: 3px; }
    .choix button span { font-size: 13.5px; opacity: .78; line-height: 1.45; }
    .choix button:disabled { opacity: .45; }
    .chiffres { font-size: 13px; opacity: .85; line-height: 1.6; margin: 10px 0 0; }
    .chiffres td { padding: 2px 10px 2px 0; white-space: nowrap; }
    .chiffres td:first-child { opacity: .7; }
    .jour { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 2px; }
    .jour button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
    .jour button.on { background: var(--accent); color: #10202F; border-color: transparent; font-weight: 700; }
    .mot { font-size: 14px; line-height: 1.6; opacity: .9; }
    .ko { color: #E4572E; }
  </style>
</head>
<body>
<a id="sortie" href="index.html">
  <svg class="i" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  Retour au carnet</a>
<div id="essai-map"></div>
<div class="essai">
  <h1 style="font-family:var(--font-title);font-size:21px;margin:14px 0 6px">Trois façons de survoler une journée</h1>
  <p class="mot" id="mot">Un instant, je cherche tes carnets…</p>
  <form id="connexion" hidden>
    <div class="field"><label>Ton adresse</label><input name="email" type="email" autocomplete="username" required></div>
    <div class="field"><label>Ton mot de passe</label><input name="mdp" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit">Voir mes carnets</button>
    <p class="small muted" id="connexion-ko" style="margin:8px 0 0"></p>
  </form>
  <div class="jour" id="carnets"></div>
  <div class="jour" id="jours"></div>
  <div class="choix">
    <button id="bA" disabled><b>A · le recul d'aujourd'hui</b><span>Le même mouvement que l'app fait déjà entre deux journées : rapide, borné à six secondes. La journée dure environ 23 s.</span></button>
    <button id="bB" disabled><b>B · le recul lent</b><span>La caméra recule trois fois plus doucement, sans limite de durée. Plus posé, mais la journée dure environ 46 s.</span></button>
    <button id="bC" disabled><b>C · comme aujourd'hui en ligne</b><span>Sans coupure : une seule échelle pour toute la journée. C'est ce que tu as vu jusqu'ici — pour comparer.</span></button>
  </div>
  <table class="chiffres" id="chiffres"></table>
</div>
<div id="valdo-host"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/config.js"></script>
<script src="js/pictos.js"></script>
<script src="js/map.js"></script>
<script src="js/common.js"></script>
<script src="js/offline.js"></script>
<script src="js/api.js"></script>
<script src="js/members.js"></script>
<script>
// Page d'essai #61. Règle 12 : elle joue le VRAI survol, sur le VRAI carnet, par le jeton
// d'un lien de partage. Les deux variantes ne sont pas réécrites ici — c'est la même
// fonction BVMAP.replay, avec et sans l'option `saut`. Aucune divergence possible.
(async () => {
  const $ = (s) => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  const mot = $("#mot");

  // Règle 13 · La sortie ramène au VOYAGE qu'on lisait, pas à la liste. Elle est posée avant
  // tout le reste : même si le chargement du carnet échoue, elle est là et elle marche.
  const retour = params.get("retour") || "";
  if (retour) $("#sortie").setAttribute("href", "index.html#trip=" + encodeURIComponent(retour));

  // D'OÙ VIENT LE CARNET. Sophie n'a rien à composer ni à coller : c'est le même site que
  // son app, donc la même session. On la lui demande seulement si elle n'en a pas.
  let D = null;
  const jeton = params.get("jeton") || params.get("t") || "";   // second recours, jamais affiché

  async function ouvrir(id, titre) {
    mot.textContent = "Ouverture de « " + titre + " »…";
    $("#carnets").innerHTML = "";
    $("#connexion").hidden = true;
    try { D = await API.loadTrip(id); } catch (e) { mot.innerHTML = `<span class="ko">${e.message}</span>`; return; }
    demarrer();
  }
  async function listerCarnets() {
    let liste;
    try { liste = await API.listTrips(); } catch (e) { return demanderConnexion(e.message); }
    if (!liste || !liste.length) { mot.innerHTML = `<span class="ko">Aucun carnet sur ce compte.</span>`; return; }
    mot.textContent = "Quel carnet veux-tu regarder ?";
    $("#carnets").innerHTML = liste.map((t, i) => `<button data-i="${i}">${t.title || "Sans titre"}</button>`).join("");
    $("#carnets").querySelectorAll("button").forEach((b) => b.onclick = () => ouvrir(liste[+b.dataset.i].id, liste[+b.dataset.i].title));
    // Un seul carnet : on l'ouvre, il n'y a rien à choisir.
    if (liste.length === 1) ouvrir(liste[0].id, liste[0].title);
  }
  function demanderConnexion(raison) {
    mot.textContent = "Connecte-toi, comme dans ton app.";
    $("#connexion").hidden = false;
    if (raison) $("#connexion-ko").textContent = "";
  }
  $("#connexion").onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target;
    $("#connexion-ko").textContent = "";
    try { await API.signIn(f.email.value.trim(), f.mdp.value); $("#connexion").hidden = true; await listerCarnets(); }
    catch (err) { $("#connexion-ko").innerHTML = `<span class="ko">${err.message}</span>`; }
  };

  if (jeton) {
    try { D = await API.getSharedTrip(jeton); } catch (e) { mot.innerHTML = `<span class="ko">${e.message}</span>`; return; }
  } else {
    const u = await API.getUser().catch(() => null);
    if (u) await listerCarnets(); else demanderConnexion();
  }

  const map = BVMAP.create("essai-map", { reading: true });

  // Tout ce qui suit démarre une fois le carnet là — tout de suite si on est arrivée par un
  // lien de partage, après le choix sinon.
  function demarrer() {
  const jours = [...new Set((D.media || []).map((m) => m.day_date).concat((D.days || []).map((d) => d.day_date)).filter(Boolean))].sort();
  let iso = jours[0];

  // Quels jours la coupure change-t-elle ? On le dit avant de faire choisir.
  const R = 6371000, rd = Math.PI / 180;
  const dd = (a, b) => { const dLat = (b[1] - a[1]) * rd, dLng = (b[0] - a[0]) * rd;
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * rd) * Math.cos(b[1] * rd) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s)); };
  const ECRANS = 3.5, EPS = .26;
  // Les séquences viennent de LA FONCTION DE L'APP, pas d'une copie : si un jour la règle de
  // coupe change, cette page change avec elle.
  const longueur = (c) => { let t = 0; for (let i = 1; i < c.length; i++) t += dd(c[i - 1], c[i]); return t; };
  const zoomDe = (m, ecrans, lat) => Math.min(17, Math.max(3,
    Math.log2(156543.03392 * Math.cos(lat * rd) * (map.container.clientWidth || 440) * ecrans / m)));
  function mesures(iso) {
    const ch = BVMAP.dayPath ? BVMAP.dayPath(D, iso) : null;
    const c = (ch && ch.coords) || [];
    if (c.length < 2) return null;
    const t = longueur(c);
    const seqs = BVMAP.couperEnSequences({ coords: c, modes: c.modes || null, photos: [], iso });
    const coupe = seqs.length > 1;
    const m = seqs.map((s) => {
      const lg = longueur(s.coords), ec = s._vol ? 1 : ECRANS;
      return { vol: !!s._vol, lg, ec, duree: ec / EPS, zoom: zoomDe(lg, ec, s.coords[0][1]) };
    });
    const dz = coupe ? Math.abs(m[m.length - 1].zoom - m[0].zoom) : 0;
    return { c, t, coupe, seqs: m, dz, duree: ECRANS / EPS };
  }
  function ligne(a, b) { return `<tr><td>${a}</td><td><b>${b}</b></td></tr>`; }
  function afficher() {
    const m = mesures(iso);
    const t = $("#chiffres");
    if (!m) { t.innerHTML = ligne("cette journée", "pas de trajet à survoler"); return; }
    let h = ligne("longueur de la journée", (m.t / 1000).toFixed(0) + " km");
    if (!m.coupe) {
      h += ligne("séquences", "une seule — aucun tronçon en avion") +
           ligne("A, B et C", "identiques sur cette journée");
    } else {
      m.seqs.forEach((s, i) => {
        h += ligne(`séquence ${i + 1} · ${s.vol ? "le vol" : "au sol"}`,
          (s.lg / 1000).toFixed(s.lg > 10000 ? 0 : 1) + " km en " + s.duree.toFixed(1) + " s");
      });
      h += ligne("recul entre les deux", m.dz.toFixed(1) + " crans");
      const a = Math.min(6, m.dz / .65), b = m.dz / .42;
      h += ligne("A · recul", a.toFixed(1) + " s, soit " + (m.dz / a).toFixed(2) + " cran/s");
      h += ligne("B · recul", b.toFixed(1) + " s, soit 0,42 cran/s");
      h += ligne("durée de la journée", "A " + (1 / EPS + a + ECRANS / EPS).toFixed(0) + " s · B "
        + (1 / EPS + b + ECRANS / EPS).toFixed(0) + " s · C " + (ECRANS / EPS).toFixed(0) + " s");
    }
    t.innerHTML = h;
  }
  function rendreJours() {
    $("#jours").innerHTML = jours.map((j) => {
      const m = mesures(j);
      return `<button data-j="${j}" class="${j === iso ? "on" : ""}">${CV.fmtDate ? CV.fmtDate(j, false) : j}${m && m.coupe ? " ●" : ""}</button>`;
    }).join("");
    $("#jours").querySelectorAll("button").forEach((b) => b.onclick = () => { iso = b.dataset.j; rendreJours(); afficher(); });
  }
  // Une journée coupée par défaut, s'il y en a une : c'est celle qui montre quelque chose.
  const candidate = jours.find((j) => { const m = mesures(j); return m && m.coupe; });
  if (candidate) iso = candidate;
  rendreJours(); afficher();
  mot.innerHTML = `<b>${D.trip.title}</b> — choisis une journée (● = une journée où les deux variantes diffèrent), puis A ou B.
    <br>Regarde la même chose à chaque fois : <b>vois-tu ce que tu as fait dans la ville d'arrivée ?</b>`;

  BVMAP.draw(map, D, { dayList: jours, dayFilter: null });
  const boutons = ["#bA", "#bB", "#bC"];
  const ouvrir = (oui) => boutons.forEach((b) => $(b).disabled = !oui);
  const jouer = (opts) => {
    if (map.replaying) return;
    ouvrir(false);
    const ctl = BVMAP.replay(map, D, Object.assign({ dayList: jours, only: iso }, opts));
    const fin = setInterval(() => { if (!map.replaying) { clearInterval(fin); ouvrir(true); } }, 400);
    if (!ctl) { clearInterval(fin); ouvrir(true); }
  };
  // Les trois variantes appellent LA MÊME fonction que l'app : aucune divergence possible
  // entre ce que Sophie juge et ce qui sera livré.
  $("#bA").onclick = () => jouer({ sequences: true });                                        // 0,65 cran/s, borné à 6 s
  $("#bB").onclick = () => jouer({ sequences: true, recul: { taux: .42, plafondMs: 60000 } });
  $("#bC").onclick = () => jouer({});                                                          // le survol en ligne
  // Les boutons n'ouvrent que quand la carte est prête : un appui dans le vide ferait croire
  // à Sophie que la page ne marche pas.
  const prete = setInterval(() => { if (!map.ready) return; clearInterval(prete); ouvrir(true); }, 200);
  }

  if (D) demarrer();
})();
</script>
</body>
</html>
